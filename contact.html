<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

<title>ติดต่อ | Samita</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scrollbar-gutter: stable;
}

body {
    margin: 0;
    padding-top: 70px;

    font-family: "Itim", cursive;

    background:
        radial-gradient(
            circle at 8% 15%,
            rgba(255,255,255,0.65) 0 45px,
            transparent 46px
        ),
        radial-gradient(
            circle at 92% 25%,
            rgba(255,255,255,0.45) 0 35px,
            transparent 36px
        ),
        #CDE9DC;

    color: #40534A;
}


/* =========================
   เมนูด้านบน
========================= */

.menu {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 70px;

    background: rgba(255,255,255,0.96);

    box-shadow:
        0 4px 15px rgba(64,83,74,0.10);

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 0 20px;

    gap: 8px;

    z-index: 1000;

    overflow-x: auto;
    overflow-y: hidden;
}

.menu a {
    flex-shrink: 0;

    color: #40534A;

    text-decoration: none;

    font-size: 18px;

    padding: 10px 16px;

    border-radius: 20px;

    white-space: nowrap;

    transition:
        color 0.25s ease,
        background-color 0.25s ease,
        transform 0.25s ease;
}

.menu a:hover {
    color: #527A66;

    background-color: #E4F4EC;

    transform: translateY(-2px);
}

.menu a.active {
    color: #527A66;

    background-color: #DCEFE5;

    box-shadow:
        inset 0 0 0 1px #C5E3D3;
}


/* =========================
   ของตกแต่ง
========================= */

.decor {
    position: fixed;

    color: #76A98D;

    opacity: 0.55;

    pointer-events: none;

    z-index: 0;
}

.decor.one {
    top: 110px;
    left: 5%;

    font-size: 28px;
}

.decor.two {
    top: 180px;
    right: 6%;

    font-size: 22px;
}

.decor.three {
    bottom: 15%;
    left: 7%;

    font-size: 25px;
}

.decor.four {
    bottom: 10%;
    right: 8%;

    font-size: 30px;
}


/* =========================
   เนื้อหาหลัก
========================= */

.container {
    width: 90%;
    max-width: 1000px;

    min-height: calc(100vh - 70px);

    margin: auto;

    padding: 55px 0 80px;

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;

    z-index: 1;
}


/* =========================
   หัวข้อ
========================= */

.contact-box {
    width: 100%;

    background: rgba(255,255,255,0.96);

    border: 2px solid #E4F4EC;

    border-radius: 32px;

    padding: 50px 60px;

    text-align: center;

    box-shadow:
        0 12px 30px rgba(64,83,74,0.12);

    position: relative;

    overflow: hidden;
}

.contact-box::before {
    content: "";

    position: absolute;

    top: 0;
    left: 45px;
    right: 45px;

    height: 6px;

    background: #A8D2BB;

    border-radius: 0 0 12px 12px;
}

.contact-box h1 {
    margin: 0 0 12px;

    color: #527A66;

    font-size: 42px;
}

.contact-box > p {
    margin: 0 auto 35px;

    color: #648071;

    font-size: 20px;
}

.title-line {
    width: 90px;

    height: 5px;

    margin: 18px auto 35px;

    background: #A8D2BB;

    border-radius: 20px;
}


/* =========================
   ข้อมูลติดต่อ
========================= */

.contact-list {
    display: flex;

    flex-direction: column;

    gap: 20px;

    max-width: 700px;

    margin: auto;
}

.contact-item {
    display: flex;

    align-items: center;

    text-align: left;

    padding: 20px 25px;

    background: #F7FCF9;

    border: 2px solid #E4F4EC;

    border-radius: 22px;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.contact-item:hover {
    transform: translateY(-3px);

    box-shadow:
        0 8px 20px rgba(64,83,74,0.09);
}

.contact-icon {
    width: 55px;
    height: 55px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-right: 18px;

    background: #E4F4EC;

    border-radius: 18px;

    font-size: 28px;
}

.contact-info {
    display: flex;

    flex-direction: column;

    gap: 3px;
}

.contact-info strong {
    color: #527A66;

    font-size: 21px;
}

.contact-info span,
.contact-info a {
    color: #4E6258;

    font-size: 19px;

    text-decoration: none;
}

.contact-info a:hover {
    color: #527A66;
}


/* =========================
   ข้อความท้าย
========================= */

.end-message {
    margin-top: 35px;

    padding: 20px 25px;

    background: #EAF6EF;

    border-radius: 22px;

    color: #648071;

    font-size: 18px;

    line-height: 1.7;
}


/* =========================
   Responsive
========================= */

@media (max-width: 800px) {

    .menu {
        justify-content: flex-start;

        padding: 0 12px;

        gap: 2px;
    }

    .menu a {
        font-size: 16px;

        padding: 9px 13px;
    }

    .container {
        width: 90%;

        padding-top: 40px;
    }

    .contact-box {
        padding: 40px 22px;
    }

    .contact-box h1 {
        font-size: 33px;
    }

    .contact-box > p {
        font-size: 18px;
    }

    .contact-item {
        padding: 17px;
    }

    .contact-icon {
        width: 48px;
        height: 48px;

        margin-right: 13px;

        font-size: 23px;
    }

    .contact-info strong {
        font-size: 19px;
    }

    .contact-info span,
    .contact-info a {
        font-size: 17px;
        word-break: break-word;
    }

    .decor {
        display: none;
    }
}

</style>

</head>


<body>

     เมนู
========================= -->

                    </strong>

                    <a href="mailto:chttngtta@gmail.com">

                    </a>

                </div>

            </div>


            <!-- Instagram -->

            <div class="contact-item">

                <div class="contact-icon">

                </div>

                <div class="contact-info">

                    <strong>

                    </strong>

                    <a href="https://www.instagram.com/onlytortor/" target="_blank">

            <!-- Phone -->

            <div class="contact-item">

                <div class="contact-info">

                    <strong>

        </div>


        <div class="end-message">

            ✦ ขอบคุณที่เข้ามาเยี่ยมชมแฟ้มสะสมงานของฉัน ♡
            <br>
            หากสนใจผลงานหรือมีข้อสงสัย

        </div>

    </div>

</div>


</body>

</html>
